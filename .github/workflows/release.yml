name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify APK
        run: |
          sha256sum -c SHA256SUMS
          cmp docs/download/Sniffy.apk docs/download/Sniffy-v1.3.0.apk
      - name: Create release and upload APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" docs/download/Sniffy.apk docs/checksums.txt --clobber
          else
            gh release create "$GITHUB_REF_NAME" docs/download/Sniffy.apk docs/checksums.txt \
              --title "Sniffy ${GITHUB_REF_NAME#v}" \
              --generate-notes
          fi
